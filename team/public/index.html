<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Команда Рыжикова</title>
  <script src="telegram-web-app.js"></script>
  <meta name="theme-color" content="#f3f3f0">
  <link rel="preload" href="hero.webp" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <div class="loader">Загрузка…</div>
  </main>
  <nav id="tabs" hidden>
    <button data-tab="today" class="active"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></span>Сегодня</button>
    <button data-tab="clients"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.7 3.2 2.5 3.5 5.2"/></svg></span>Клиенты</button>
    <button data-tab="calendar"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8 14h2M14 14h2M8 17h2"/></svg></span>Окна</button>
    <button data-tab="stats"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16.5v-4M12 16.5V7M17 16.5v-6.5"/></svg></span>РнП</button>
    <button data-tab="more"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>Ещё</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
