name = "ryzhikov-team"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Не затирать переменные, добавленные в дашборде Cloudflare.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# База команды (D1 = SQLite). Без database_id wrangler сам создаст базу при первом деплое.
[[d1_databases]]
binding = "DB"
database_name = "ryzhikov-team"

# Каждую минуту — напоминания о созвонах; 05:57 UTC = 08:57 МСК — утренний план; 18:00 UTC = 21:00 МСК — кто не закрыл день.
[triggers]
crons = ["* * * * *", "57 5 * * *", "0 18 * * *"]

[vars]
APP_URL = "https://ryzhikov-team.dasadalol143.workers.dev/"
# Собственники: всегда полный доступ. Остальных добавляешь в приложении → «Команда».
OWNER_IDS = "1971711686"

# BOT_TOKEN — секрет: `npx wrangler secret put BOT_TOKEN` или в дашборде Cloudflare.

# Workers AI — расшифровка голосовых (Whisper). Бесплатный дневной лимит Cloudflare, ключ не нужен.
[ai]
binding = "AI"

# ИИ в чате бота (Claude): секрет ANTHROPIC_API_KEY в дашборде Cloudflare. Нет секрета — ИИ выключен.
# Необязательно: AI_MODEL (по умолчанию claude-haiku-5-5), AI_DAILY_LIMIT (по умолчанию 300 запросов в день).
