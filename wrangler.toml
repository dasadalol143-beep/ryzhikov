name = "ryzhikov"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Не затирать переменные, добавленные в дашборде Cloudflare.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

# База лидов. Без id wrangler сам создаёт namespace при первом деплое.
[[kv_namespaces]]
binding = "CRM"

# CRM для учеников академии — отдельная база. Без id wrangler сам создаёт её при первом деплое.
[[d1_databases]]
binding = "ACADEMY_DB"
database_name = "ryzhikov-academy"

# Утренняя сводка: 05:57 UTC = 08:57 по Москве. Каждую минуту — напоминания из бота.
[triggers]
crons = ["57 5 * * *", "* * * * *"]

[vars]
APP_URL = "https://ryzhikov.dasadalol143.workers.dev/"
ADMIN_IDS = "1971711686,1036213497"
MANAGER_IDS = ""
# Наставник в CRM учеников (видит всех учеников и выдаёт коды доступа).
ACADEMY_MENTOR_IDS = "1971711686"

# ACADEMY_BOT_TOKEN — секрет: токен отдельного бота для учеников.
# BOT_TOKEN — секрет: `npx wrangler secret put BOT_TOKEN` или в дашборде Cloudflare.
